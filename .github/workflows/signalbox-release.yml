name: signalbox-release
on:
  push:
    branches: [signalbox]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signalbox-publish
  cancel-in-progress: false
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
  CODEX_REPO_ROOT: ${{ github.workspace }}
jobs:
  tests:
    if: github.repository == 'KeenWill/codex'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Runner capacity
        run: |
          nproc
          free -h
          df -h .
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      - uses: ./.github/actions/setup-ci
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcap-dev pkg-config libssl-dev clang cmake bubblewrap
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest
          version: 0.9.103
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: codex-rs
          key: signalbox-tests
          cache-on-failure: true
      - name: Build runtime test helpers
        working-directory: codex-rs
        run: cargo build --bin codex --bin codex-code-mode-host --bin codex-linux-sandbox --bin codex-execve-wrapper --bin test_stdio_server --bin bwrap
      - name: Exec and app-server tests
        working-directory: codex-rs
        run: just test -p codex-exec -p codex-app-server --test-threads=1
  build:
    if: github.repository == 'KeenWill/codex'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TARGET: x86_64-unknown-linux-musl
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Runner capacity
        run: |
          nproc
          free -h
          df -h .
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          targets: x86_64-unknown-linux-musl
      - name: Use hermetic Cargo home (musl)
        run: |
          cargo_home="$GITHUB_WORKSPACE/.cargo-home"
          mkdir -p "$cargo_home/bin"
          echo "CARGO_HOME=$cargo_home" >> "$GITHUB_ENV"
          echo "$cargo_home/bin" >> "$GITHUB_PATH"
          : > "$cargo_home/config.toml"
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.0
          use-cache: false
      - name: Install musl build tools
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-musl-build-tools.sh"
      - name: Disable aws-lc jitter entropy (musl)
        run: |
          echo 'AWS_LC_SYS_NO_JITTER_ENTROPY=1' >> "$GITHUB_ENV"
          echo 'AWS_LC_SYS_NO_JITTER_ENTROPY_x86_64_unknown_linux_musl=1' >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: codex-rs
          key: signalbox-musl
          cache-on-failure: true
      - name: Build and hash bwrap
        run: |
          cargo build --release --target "$TARGET" --bin bwrap
          strip --strip-debug --strip-unneeded "target/$TARGET/release/bwrap"
          digest=$(sha256sum "target/$TARGET/release/bwrap" | cut -d ' ' -f 1)
          echo "CODEX_BWRAP_SHA256=$digest" >> "$GITHUB_ENV"
      - name: Build multitool and companion binaries
        run: |
          cargo build --release -p codex-cli --target "$TARGET" --bin codex
          cargo build --release --target "$TARGET" --bin codex-code-mode-host --bin codex-responses-api-proxy
      - name: Check upstream version and app-server flags
        run: |
          binary="target/$TARGET/release/codex"
          version=$(cat ../.signalbox-base)
          test "$("$binary" --version)" = "codex-cli ${version#rust-v}"
          "$binary" app-server --ignore-user-config --ignore-rules --stdio < /dev/null
      - name: Package
        run: |
          mkdir -p ../dist
          for binary in codex codex-code-mode-host codex-responses-api-proxy; do
            strip --strip-debug --strip-unneeded "target/$TARGET/release/$binary"
          done
          tar -czf "../dist/codex-$TARGET.tar.gz" -C "target/$TARGET/release" codex codex-code-mode-host codex-responses-api-proxy bwrap
          cd ../dist
          sha256sum "codex-$TARGET.tar.gz" > SHA256SUMS
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: signalbox-linux
          path: dist/*
  release:
    needs: [tests, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signalbox-linux
          path: dist
      - name: Publish the next fork revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base=$(cat .signalbox-base)
          prefix="$base-signalbox."
          revision=0
          while read -r tag; do
            if [[ "$tag" == "$prefix"* ]]; then
              if [[ "$(git rev-list -n 1 "$tag")" == "$GITHUB_SHA" ]]; then
                echo "$GITHUB_SHA is already released as $tag"
                exit 0
              fi
              number=${tag#"$prefix"}
              if [[ "$number" =~ ^[0-9]+$ ]] && (( number > revision )); then
                revision=$number
              fi
            fi
          done < <(git tag -l "$prefix*")
          tag="$prefix$((revision + 1))"
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --notes "Codex ${base#rust-v} with the Signalbox patches. See README-signalbox.md at this tag. The binary reports the upstream version unchanged." --latest
